name: Static integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile submission-v2 reviewer entry points
        run: |
          python -m py_compile RUN_REVIEWER.py
          python -m py_compile scripts/build_portable_bundle.py
          python -m py_compile scripts/build_submission_candidate.py
          python -m py_compile scripts/run_cleanroom_reviewer_test.py
          python -m py_compile scripts/verify_submission_v2_science.py
          python -m py_compile scripts/build_submission_v2_manifest.py
          python -m py_compile scripts/verify_submission_v2_manifest.py

      - name: Verify submission-v2 frozen scientific invariants
        run: python scripts/verify_submission_v2_science.py

      - name: Verify submission-v2 manifest scope can be built
        run: python scripts/build_submission_v2_manifest.py --out ../submission_v2_manifest_ci.csv

      - name: Verify committed submission-v2 manifest
        run: python scripts/verify_submission_v2_manifest.py

      - name: Verify lean reviewer and clean-room plans
        run: |
          python scripts/build_submission_candidate.py --plan
          python scripts/run_cleanroom_reviewer_test.py --selftest

      - name: Parse clean-room PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          [scriptblock]::Create((Get-Content -Raw .\RUN_CLEANROOM_REVIEWER.ps1)) | Out-Null

      - name: Run repository unit tests (Linux)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v

      - name: Run repository unit tests (Windows stable temp path)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ciTemp = Join-Path $PWD '.ci-temp'
          New-Item -ItemType Directory -Force -Path $ciTemp | Out-Null
          $env:TEMP = $ciTemp
          $env:TMP = $ciTemp
          $env:TMPDIR = $ciTemp
          python -m unittest discover -s tests -v

      - name: Reviewer static acceptance
        run: python RUN_REVIEWER.py check

      - name: Graphical acceptance policy
        run: |
          echo "MATLAB 8/8 graphical acceptance is performed in the Windows fresh-clone clean-room gate."
          echo "CI intentionally does not execute historical deep/full-claim/archival reviewer pathways."
