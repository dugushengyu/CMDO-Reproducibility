name: Materialize final Figure 5/6 patch

on:
  push:
    paths:
      - ".cmdo_stage/final56/**"
      - "scripts/materialize_final56_patch.py"
      - ".github/workflows/materialize-final56.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Materialize sealed Figure 5/6 patch
        run: python scripts/materialize_final56_patch.py
      - name: Run Figure 5/6 audit before commit
        run: python scripts/audit_final_figure56.py
      - name: Validate Python entry points
        run: |
          python -m py_compile RUN_REVIEWER.py scripts/audit_final_figure56.py scripts/final_reviewer_acceptance.py
      - name: Commit audited patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            RUN_ALL_FIGURES.m \
            RUN_REVIEWER.py \
            matlab/figures/main/Figure5.m \
            matlab/figures/main/Figure6.m \
            scripts/audit_final_figure56.py \
            scripts/final_reviewer_acceptance.py \
            docs/REVIEWER_QUICKSTART.md \
            docs/FIGURE5_6_REPRODUCIBILITY_AUDIT_2026-08-17.md \
            provenance/final_figure56_seal.json \
            source_data/figure6_u8_u9/README.md \
            source_data/figure6_admissibility
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No materialized changes to commit."
          else
            git commit -m "Seal and audit final Figure 5/6 reviewer reproduction"
            git push
          fi
